<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/index.css" />
    <title>СТРАНИЦА 2</title>
    <style>
      h1 {
        text-align: center;
        color: moccasin;
        font-size: 50px;
      }
      p {
        text-align: center;
        color: tomato;
        font-size: 80px;
      }

      body {
        animation: fadeIn 0.4s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
    <script src="./scripts/pagination.js" defer></script>
  </head>
  <body>
    <h1>UNDER CONSTRUCTION</h1>
    <p>Страница №2</p>

    <div
      style="margin: 100px auto; width: max-content"
      class="offers__paginator"
    >
      <div class="offers__paginator-controls">
        <a
          href="#"
          class="offers__paginator-btn offers__paginator-btn--prev"
          aria-label="Назад"
        ></a>
        <a href="#" class="offers__paginator-btn" aria-label="Вперед"></a>
      </div>
      <span class="offers__paginator-pages" aria-live="polite">1 из 3</span>
    </div>
  </body>
</html>
